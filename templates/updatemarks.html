{% extends 'base.html' %}{% block title %}Update marks{% endblock %}{% block content %}<div class="eyebrow">Teacher workspace / results</div><h1 class="heading">Update a result.</h1><p class="sub">Match the student ID, subject, term and session to update the saved score.</p><section class="panel"><form method="post" class="form-grid"><div class="field"><label for="student_id">Student ID</label><input id="student_id" name="student_id" type="number" min="1" step="1" required></div><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="50" required></div><div class="field"><label for="marks">New marks (out of 100)</label><input id="marks" name="marks" type="number" min="0" max="100" step="1" required></div><div class="field"><label for="term">Term</label><select id="term" name="term" required>{% for term in terms %}<option>{{ term }}</option>{% endfor %}</select></div><div class="field full"><label for="session">Session year</label><input id="session" name="session" type="number" min="2000" max="2100" step="1" required placeholder="e.g. 2026"></div><div class="field full"><button class="btn" type="submit">Update marks →</button></div></form></section>{% endblock %}
